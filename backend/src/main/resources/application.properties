spring.application.name=careerlens-backend
server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/careerlens}
spring.data.mongodb.database=${MONGODB_DATABASE:careerlens}

jwt.secret=${JWT_SECRET:defaultSecretKeyForCareerLensWhichIsAtLeastSixtyFourBytesLongRequirementForHmacSha512Algorithm!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

storage.type=${STORAGE_TYPE:local}
storage.local.path=${LOCAL_UPLOAD_PATH:./uploads}

otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
otp.max-attempts=${OTP_MAX_ATTEMPTS:3}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN:60}
otp.rate-limit-per-hour=${OTP_RATE_LIMIT:5}

spring.mail.host=${EMAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${EMAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${EMAIL_USERNAME:${MAIL_USERNAME:baklol5033@gmail.com}}
spring.mail.password=${EMAIL_PASSWORD:${MAIL_PASSWORD:bewizmpzjwqjmqzg}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

logging.level.com.careerlens=DEBUG
logging.level.org.springframework.security=INFO
